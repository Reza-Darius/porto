name: "Test Suite"
on:
  push:
  pull_request:

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Install mkcert
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          curl -JLO "https://dl.filippo.io/mkcert/latest?for=linux/amd64"
          chmod +x mkcert-v*-linux-amd64
          sudo mv mkcert-v*-linux-amd64 /usr/local/bin/mkcert

      - name: Generate test certificates
        run: |
          mkcert -install
          mkdir -p credentials
          mkcert \
            -cert-file credentials/testpeer.com+2.pem \
            -key-file credentials/testpeer.com+2-key.pem \
            testpeer.com testpeeruds.com rezadarius.de
          echo "CAROOT=$(mkcert -CAROOT)" >> "$GITHUB_ENV"

      - run: |
          ls -l "$(mkcert -CAROOT)"
          openssl verify -CAfile "$(mkcert -CAROOT)/rootCA.pem" credentials/testpeer.com+2.pem
      - run: cargo test --locked --all-features
        env:
          RUST_LOG: debug
  # Check formatting with rustfmt
  formatting:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Ensure rustfmt is installed and setup problem matcher
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt

      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1
